name: AdmiralPost database preflight (read-only)

on:
  push:
    branches:
      - setup-admiralpost-db-migrations-20261116

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate migration files and generate deterministic manifest
        run: |
          python3 scripts/validate_migrations.py
          test -s dist/admiralpost-db-migrations.json
          python3 -m py_compile scripts/db_migrations.py
          python3 scripts/db_migrations.py --check
      - name: Inspect production host without touching database or website
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?missing host}"
          : "${DEPLOY_USER:?missing user}"
          : "${DEPLOY_SSH_KEY:?missing key}"
          : "${DEPLOY_KNOWN_HOSTS:?missing known hosts}"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            echo "===== OS ====="
            uname -s -m
            echo "===== DEPLOY USER ====="
            id
            echo "===== EXISTING DEPLOY ====="
            test -L /srv/admiralpost/current && readlink -f /srv/admiralpost/current || true
            test -d /var/lib/admiralpost-deploy/incoming && echo "incoming exists"
            sudo -n -l /usr/local/sbin/admiralpost-deploy >/dev/null && echo "existing sudo deployment rule works"
            echo "===== DATABASE CLIENT TOOLS ====="
            for c in psql pg_dump pg_restore pg_isready docker podman; do
              if command -v "$c" >/dev/null 2>&1; then
                command -v "$c"
                case "$c" in
                  psql|pg_dump|pg_restore) "$c" --version ;;
                esac
              else
                echo "$c: not in PATH"
              fi
            done
            echo "===== LOCAL POSTGRES LISTENERS ====="
            if command -v ss >/dev/null 2>&1; then
              ss -ltn | grep -E "(:5432|:6543|:6432)[[:space:]]" || echo "none of the standard ports seen"
            fi
            if [ -S /var/run/postgresql/.s.PGSQL.5432 ]; then echo "PostgreSQL Unix socket exists"; fi
            echo "===== CONTAINERS VISIBLE TO DEPLOY USER ====="
            if command -v docker >/dev/null 2>&1; then
              docker ps --format "{{.Names}} {{.Image}}" 2>/dev/null || echo "docker ps denied or unavailable"
            fi
            echo "===== POSTGRES SERVICE / CLUSTERS ====="
            if command -v pg_lsclusters >/dev/null 2>&1; then pg_lsclusters -h || true; fi
            systemctl is-active postgresql 2>/dev/null || true
            echo "===== ENDPOINT DNS ADDRESSES ====="
            getent ahostsv4 supabase.alilpost.ge 2>/dev/null | cut -c1-50 | sort -u || true
            echo "===== LOCAL INTERFACES (ADDRESS ONLY) ====="
            if command -v ip >/dev/null 2>&1; then
              ip -4 -o addr show scope global 2>/dev/null | cut -c1-150 || true
            fi
            echo "===== POSTGRES CONNECTION READ ONLY / NO CREDENTIALS ====="
            for mode in local tcp; do
              if [ "$mode" = local ]; then
                if PGCONNECT_TIMEOUT=3 psql -X -w -A -t -c "select current_database(), current_user" >/dev/null 2>&1; then
                  echo "Unprivileged deploy-user can connect over local socket"
                else
                  echo "Unprivileged deploy-user cannot connect over local socket"
                fi
              else
                if PGCONNECT_TIMEOUT=3 psql -X -w -h 127.0.0.1 -p 5432 -A -t -c "select current_database(), current_user" >/dev/null 2>&1; then
                  echo "Unprivileged deploy-user can connect over localhost TCP"
                else
                  echo "Unprivileged deploy-user cannot connect over localhost TCP"
                fi
              fi
            done
            echo "===== DEPLOY SCRIPT READABILITY ====="
            if [ -r /usr/local/sbin/admiralpost-deploy ]; then
              echo "Existing root-owned deploy script is readable by deployment user"
            else
              echo "Existing root-owned deploy script is not readable by deployment user"
            fi
            echo "===== COMPLETED (READ ONLY) ====="
          '
